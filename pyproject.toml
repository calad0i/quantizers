[build-system]
requires = ["setuptools>=67.8", "setuptools_scm>=8"]

build-backend = "setuptools.build_meta"

[project]
name = "quantizers"
authors = [{ name = "Chang Sun", email = "chsun@cern.ch" }]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU Lesser General Public License v3 (LGPLv3)" }
keywords = ["quantization"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Development Status :: 5 - Production/Stable",
]
dynamic = [ "version" ]


[project.urls]
repository = "https://github.com/calad0i/quantizers"


[tool.setuptools]
packages = ["quantizers"]
include-package-data = true
package-dir = { "" = "src" }


[tool.setuptools_scm]
write_to = "src/quantizers/_version.py"

[project.optional-dependencies]
dependencies = ["numpy"]

test = [
  'pytest',
  'pytest-cov',
  'pytest-xdist',
  'pytest-env',
  'jax',
  'tensorflow',
  'torch',
  'tinygrad',
  'mlx[cpu]',
  'keras>=3.0.0',
]

[tool.pytest.ini_options]
filterwarnings = [

]

env = [
  "JAX_PLATFORMS=cpu",
  "CUDA_VISIBLE_DEVICES=-1",
]

pythonpath = ["test"]
addopts = "--import-mode=importlib --cov=src/quantizers --cov-report=xml --cov-report=html"

[tool.coverage.run]
omit = ["*/_version.py"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = ['pragma: no cover', 'if TYPE_CHECKING:']

[tool.ruff]
include = ["src/**/*.py"]

line-length = 130
indent-width = 4

target-version = "py310"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 130

[tool.ruff.lint]
select = ["E", "W", "F", "I", "F401"]
ignore = ["E501", "F403", "F405", "E741"]
explicit-preview-rules = true
fixable = ["ALL"]
unfixable = []
